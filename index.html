<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ALGRA STORE - Top Up Robux</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#202124;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;background:#fff;min-height:100vh}
.top{position:sticky;top:0;background:#fff;z-index:3;padding:16px 18px 12px;border-bottom:1px solid #eee}.back{color:#777}.title{font-size:23px;font-weight:800;margin-top:7px}.step{margin-top:5px;color:#555}.progress{height:6px;background:#ddd;border-radius:8px;margin-top:11px}.progress span{display:block;width:33%;height:100%;background:#16a34a;border-radius:8px}
main{padding:27px 20px 40px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:25px;margin:0 0 18px}.po{background:#fff4d8;color:#b47700;padding:10px 13px;border-radius:22px;font-weight:700}
.user{display:flex;align-items:center;border:1px solid #ddd;border-radius:16px;padding:0 15px;margin:10px 0}.user span{color:#777;font-size:18px}.user input{border:0;outline:0;padding:17px 10px;width:100%;font-size:18px}.field{width:100%;border:1px solid #ddd;border-radius:16px;background:#fff;padding:17px 18px;margin:0;font-size:18px}
.notice{background:#fff4df;padding:14px 16px;border-radius:16px;color:#555;line-height:1.4;margin:21px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{position:relative;background:#fff7e7;border:1px solid #f0e2c5;border-radius:17px;padding:17px;cursor:pointer}.card.active{border:2px solid #16a34a}.badge{position:absolute;left:-6px;top:-9px;background:#df2d3d;color:#fff;border-radius:7px;padding:4px 7px;font-size:12px;font-weight:800}.rbx{font-size:20px}.old{text-decoration:line-through;color:#aaa;margin-top:15px}.price{font-size:23px;font-weight:800;margin-top:5px}.total{margin-top:19px;padding:17px;border-radius:15px;background:#f6f6f6;display:flex;justify-content:space-between;font-size:18px}.total b{font-size:22px}.order{width:100%;border:0;background:#16a34a;color:white;padding:17px;border-radius:15px;font-size:18px;font-weight:800;margin-top:13px}.small{text-align:center;color:#777;font-size:13px;margin-top:9px}
</style></head><body><div class="wrap"><header class="top"><div class="back">← Kembali</div><div class="title">Top Up Robux - Via Username</div><div class="step"><b>1/3</b> Pilih Robux</div><div class="progress"><span></span></div></header>
<main><div class="head"><h2>Pilihan Robux</h2><div class="po">⏱ PRE-ORDER</div></div>
<div class="user"><span>@</span><input id="username" placeholder="Masukkan username Roblox"></div>
<select id="amount" class="field"><option value="">Jumlah robux</option><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option><option>900</option><option>1000</option></select>
<div class="notice">⏱ <b>Pemesanan Pre-Order Robux Via Username</b> akan diproses paling lambat 6 jam.</div><div class="grid" id="cards"></div>
<div class="total"><span>Total</span><b id="total">Rp 0</b></div><button class="order" onclick="order()">ORDER VIA WHATSAPP</button><div class="small">Pastikan username Roblox sudah benar sebelum order.</div></main></div>
<script>
const p=[[100,14690,16700],[200,29380,33400],[300,44070,50100],[400,58760,66800],[500,73450,83500],[600,88140,100200],[700,102830,116900],[800,117520,133600],[900,132210,150300],[1000,146900,167000]];
let sel=null;const cards=document.getElementById('cards'),amount=document.getElementById('amount'),total=document.getElementById('total');const rp=n=>'Rp '+n.toLocaleString('id-ID');
p.forEach(x=>{let e=document.createElement('div');e.className='card';e.dataset.r=x[0];e.innerHTML='<div class="badge">13%</div><div class="rbx">🪙 '+x[0].toLocaleString('id-ID')+' RBX</div><div class="old">'+rp(x[2])+'</div><div class="price">'+rp(x[1]).replace('Rp ','')+'</div>';e.onclick=()=>pick(x,e);cards.appendChild(e)});
function pick(x,e){sel=x;amount.value=x[0];document.querySelectorAll('.card').forEach(a=>a.classList.remove('active'));e.classList.add('active');total.textContent=rp(x[1])}
amount.onchange=()=>{let e=[...document.querySelectorAll('.card')].find(a=>+a.dataset.r===+amount.value);if(e)pick(p.find(x=>x[0]==amount.value),e)}
function order(){let u=document.getElementById('username').value.trim();if(!u)return alert('Masukkan username Roblox dulu.');if(!sel)return alert('Pilih jumlah Robux dulu.');let m='Halo ALGRA STORE, saya mau order Robux.\n\nUsername Roblox: '+u+'\nJumlah: '+sel[0].toLocaleString('id-ID')+' Robux\nTotal: '+rp(sel[1]);window.open('https://wa.me/6285848635424?text='+encodeURIComponent(m),'_blank')}
</script></body></html>
